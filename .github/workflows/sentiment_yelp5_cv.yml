name: Yelp-trained BERT transfer to five-class movie sentiment
on:
  push:
    branches: [experiment/target-macro-f1-050]
    paths:
      - ".github/workflows/sentiment_yelp5_cv.yml"
  workflow_dispatch:
jobs:
  nested_cv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install numpy pandas scipy scikit-learn pytest transformers==4.48.3 safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Extract Yelp 5-star model logits and CLS vectors from train.csv
        env:
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
        run: |
          python experiments/extract_transfer_sentiment.py --model yelp5 \
            --output experiments/features/yelp5_train.npy \
            --hidden-output experiments/features/yelp5_hidden_train.npy
      - name: Validate features
        run: python -m pytest -q tests/test_strong_sentiment.py
      - name: Compare Yelp score transfer and BGE fusion with nested CV
        env:
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python experiments/strong_sentiment_cv.py \
            --transfer experiments/features/yelp5_train.npy \
            --candidates transfer_direct transfer_only_lr bge_transfer_lr bge_transfer_svm \
            --output experiments/results/yelp5_logits_cv
      - name: Compare Yelp CLS representations and BGE fusion with nested CV
        env:
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python experiments/strong_sentiment_cv.py \
            --sentiment-embeddings experiments/features/yelp5_hidden_train.npy \
            --candidates sent_hidden_lr sent_hidden_svm bge_hidden_lr bge_hidden_svm \
            --output experiments/results/yelp5_hidden_cv
      - name: Upload results and reproducible feature metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yelp-sentiment-transfer-training-only
          path: |
            experiments/features/yelp5_train.*
            experiments/features/yelp5_hidden_train.*
            experiments/results/yelp5_logits_cv/
            experiments/results/yelp5_hidden_cv/
          if-no-files-found: warn
