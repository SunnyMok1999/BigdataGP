name: RoBERTa LoRA full five-fold sentiment OOF
on:
  push:
    branches: [experiment/posttraining-four-stage]
    paths:
      - ".github/workflows/posttrain_lora_full.yml"
  workflow_dispatch:
jobs:
  lora-5fold:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU training dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.48.3" "peft==0.14.0" pandas scikit-learn pytest
      - name: Verify outer CV invariants
        run: python -m pytest -q tests/test_posttraining.py
      - name: Run full five-fold LoRA (one full epoch per fold)
        env:
          OMP_NUM_THREADS: "3"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "3"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          HF_HUB_DISABLE_XET: "1"
        run: |
          python experiments/posttrain_roberta_lora.py \
            --folds 5 --limit-folds 5 --epochs 1 \
            --max-updates-per-fold 0 --batch-size 8 --max-length 80 \
            --device cpu --output experiments/results/posttrain_lora_full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roberta-lora-full-five-fold-training-oof
          path: experiments/results/posttrain_lora_full/
          if-no-files-found: warn
