name: SetFit five-class movie sentiment posttraining
on:
  push:
    branches: [experiment/posttraining-four-stage]
    paths:
      - "experiments/posttrain_setfit.py"
      - "experiments/posttrain_common.py"
      - "tests/test_posttraining.py"
      - ".github/workflows/posttrain_setfit.yml"
  workflow_dispatch:
jobs:
  setfit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU packages
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.48.3" "setfit==1.1.3" "datasets>=2.15,<4" pytest
      - name: Validate fold safety and output parser
        run: python -m pytest -q tests/test_posttraining.py
      - name: Run 5-fold training-only SetFit
        env:
          OMP_NUM_THREADS: "3"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "3"
          TOKENIZERS_PARALLELISM: "false"
          WANDB_DISABLED: "true"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
        run: |
          python experiments/posttrain_setfit.py \
            --model BAAI/bge-small-en-v1.5 \
            --folds 5 --limit-folds 5 --max-steps 16 \
            --output experiments/results/posttrain_setfit_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setfit-training-only-oof
          path: experiments/results/posttrain_setfit_ci/
          if-no-files-found: warn
