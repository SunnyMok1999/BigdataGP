name: Qwen LoRA SFT five-class JSON generation smoke
on:
  push:
    branches: [experiment/posttraining-four-stage]
    paths:
      - "experiments/posttrain_llm_sft.py"
      - ".github/workflows/posttrain_llm_sft.yml"
  workflow_dispatch:
jobs:
  sft-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU LoRA SFT packages
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.48.3" "peft==0.14.0" pandas scikit-learn pytest
      - name: Validate cross-validation and label parser
        run: python -m pytest -q tests/test_posttraining.py
      - name: Single-update single-fold SFT smoke (not an evaluation)
        env:
          OMP_NUM_THREADS: "3"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
        run: |
          python experiments/posttrain_llm_sft.py \
            --folds 5 --limit-folds 1 \
            --max-updates-per-fold 1 --max-valid-per-fold 8 \
            --epochs 1 --batch-size 2 --max-length 160 \
            --device cpu --output experiments/results/posttrain_qwen_sft_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-lora-sft-smoke-not-full-cv
          path: experiments/results/posttrain_qwen_sft_smoke/
          if-no-files-found: warn
