name: Strong sentiment transfer (off-domain 5-star BERT)
on:
  push:
    branches: [experiment/target-macro-f1-050]
    paths:
      - ".github/workflows/sentiment_transfer_cv.yml"
      - "experiments/extract_transfer_sentiment.py"
      - "experiments/strong_sentiment_cv.py"
      - "tests/test_strong_sentiment.py"
  workflow_dispatch:
jobs:
  pretrained_review_transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU ML libraries
        run: |
          python -m pip install numpy pandas scipy scikit-learn pytest transformers==4.48.3 safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify train-only feature protocol
        run: python -m pytest -q tests/test_strong_sentiment.py
      - name: Download off-domain product-review sentiment model and extract 511 TRAIN logits
        env:
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          HF_HUB_ETAG_TIMEOUT: "30"
        run: |
          python experiments/extract_transfer_sentiment.py --model review5 \
            --train train.csv --batch-size 16 --max-length 128 \
            --output experiments/features/review5_train.npy
      - name: Evaluate transfer alone and combined with BGE (5x3 nested CV)
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python experiments/strong_sentiment_cv.py \
            --transfer experiments/features/review5_train.npy \
            --candidates transfer_direct transfer_only_lr bge_transfer_lr bge_transfer_svm \
            --output experiments/results/strong_transfer
      - name: Store all fold outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strong-sentiment-review-transfer-cv
          path: |
            experiments/results/strong_transfer/
            experiments/features/review5_train.npy
            experiments/features/review5_train.rows.csv
            experiments/features/review5_train.metadata.json
          if-no-files-found: warn
