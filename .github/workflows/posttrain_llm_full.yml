name: Full Qwen zero-shot and few-shot sentiment OOF
on:
  push:
    branches: [experiment/posttraining-four-stage]
    paths:
      - ".github/workflows/posttrain_llm_full.yml"
  workflow_dispatch:
jobs:
  full-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [zero, few]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inference packages
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.48.3" pandas scikit-learn pytest
      - name: Validate fold and JSON invariants
        run: python -m pytest -q tests/test_posttraining.py
      - name: Classify all 511 training examples with Qwen in train-only OOF
        env:
          OMP_NUM_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
        run: |
          python experiments/posttrain_llm.py --mode ${{ matrix.mode }} \
            --folds 5 --limit-folds 5 --max-examples-per-fold 0 \
            --batch-size 4 --device cpu \
            --output experiments/results/qwen_${{ matrix.mode }}_full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-${{ matrix.mode }}-full-train-only-oof
          path: experiments/results/qwen_${{ matrix.mode }}_full/
          if-no-files-found: warn
