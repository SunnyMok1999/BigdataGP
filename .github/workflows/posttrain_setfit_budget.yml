name: SetFit posttraining step-budget ablation
on:
  push:
    branches: [experiment/posttraining-four-stage]
    paths:
      - ".github/workflows/posttrain_setfit_budget.yml"
  workflow_dispatch:
jobs:
  setfit-train-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        max_steps: [64, 128]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SetFit CPU packages
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.48.3" "setfit==1.1.3" "datasets>=2.15,<4" pytest
      - name: Fold safety tests
        run: python -m pytest -q tests/test_posttraining.py
      - name: Full five-fold evaluation
        env:
          OMP_NUM_THREADS: "3"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
        run: |
          python experiments/posttrain_setfit.py --folds 5 --limit-folds 5 \
            --max-steps ${{ matrix.max_steps }} --device cpu \
            --output experiments/results/setfit_steps_${{ matrix.max_steps }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setfit-${{ matrix.max_steps }}-steps-5fold-oof
          path: experiments/results/setfit_steps_*/
          if-no-files-found: warn
