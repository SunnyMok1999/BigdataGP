name: Compare vanilla RNN and LSTM with MaleCNS
on:
  push:
    branches: [experiment/malecns-sparse-rnn]
    paths:
      - "experiments/rnn_lstm_sentiment.py"
      - "tests/test_rnn_lstm_sentiment.py"
      - ".github/workflows/rnn_lstm_sentiment.yml"
  workflow_dispatch:

jobs:
  train-only-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy pandas scikit-learn pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate token models and isolate held-out labels
        run: python -m pytest -q tests/test_malecns.py tests/test_rnn_lstm_sentiment.py
      - name: Compare RNN, LSTM and 80-neuron MaleCNS with identical folds
        run: |
          python experiments/rnn_lstm_sentiment.py \
            --models malecns rnn lstm --folds 5 --hidden-size 80 \
            --epochs 12 --seeds 42 123 2026 --device cpu \
            --output experiments/results/rnn_lstm_comparison
      - name: Upload fold metrics, predictions and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnn-lstm-malecns-training-only-comparison
          path: experiments/results/rnn_lstm_comparison/
          if-no-files-found: warn
