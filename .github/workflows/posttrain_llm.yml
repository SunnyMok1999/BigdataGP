name: Local LLM zero-shot and five-shot sentiment smoke
on:
  push:
    branches: [experiment/posttraining-four-stage]
    paths:
      - "experiments/posttrain_llm.py"
      - "experiments/posttrain_common.py"
      - ".github/workflows/posttrain_llm.yml"
  workflow_dispatch:
jobs:
  llm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.48.3" scikit-learn pandas pytest
      - name: Verify fold-safe examples and strict JSON
        run: python -m pytest -q tests/test_posttraining.py
      - name: Run open-weight Qwen zero-shot on first 12 outer-fold examples
        env:
          OMP_NUM_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
        run: |
          python experiments/posttrain_llm.py --mode zero \
            --folds 5 --limit-folds 1 --max-examples-per-fold 12 \
            --batch-size 3 --device cpu \
            --output experiments/results/posttrain_llm_zero_smoke
      - name: Run five-shot with examples only from fold-training
        env:
          OMP_NUM_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
        run: |
          python experiments/posttrain_llm.py --mode few \
            --folds 5 --limit-folds 1 --max-examples-per-fold 12 \
            --examples-per-class 1 --batch-size 3 --device cpu \
            --output experiments/results/posttrain_llm_few_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-and-few-shot-smoke-not-full-cv
          path: experiments/results/posttrain_llm_*_smoke/
          if-no-files-found: warn
