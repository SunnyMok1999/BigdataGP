name: Amazon RoBERTa five-class transfer benchmark
on:
  push:
    branches: [experiment/target-macro-f1-050]
    paths:
      - ".github/workflows/sentiment_amazon_roberta.yml"
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install numpy pandas scipy scikit-learn transformers==4.48.3 safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Extract 5-star RoBERTa logits and last-layer features
        env:
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
        run: |
          python experiments/extract_transfer_sentiment.py --model amazon_roberta5 \
            --output experiments/features/amazon_roberta5_train.npy \
            --hidden-output experiments/features/amazon_roberta5_hidden_train.npy
      - name: Nested CV for direct and fused sentiment scores
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python experiments/strong_sentiment_cv.py \
            --transfer experiments/features/amazon_roberta5_train.npy \
            --candidates transfer_direct bge_transfer_svm \
            --output experiments/results/amazon_roberta5_logits_cv
      - name: Nested CV for sentiment-adapted representation
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python experiments/strong_sentiment_cv.py \
            --sentiment-embeddings experiments/features/amazon_roberta5_hidden_train.npy \
            --candidates sent_hidden_svm bge_hidden_svm \
            --output experiments/results/amazon_roberta5_hidden_cv
      - name: Upload OOF result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-roberta-sentiment-transfer-cv
          path: |
            experiments/features/amazon_roberta5_train.*
            experiments/features/amazon_roberta5_hidden_train.*
            experiments/results/amazon_roberta5_logits_cv/
            experiments/results/amazon_roberta5_hidden_cv/
          if-no-files-found: warn
