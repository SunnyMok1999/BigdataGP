name: Audit prior sentiment OOF majority vote
on:
  push:
    branches: [experiment/target-050-macro-f1]
    paths:
      - "experiments/target_050_vote.py"
      - ".github/workflows/target_050_vote.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  vote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: python -m pip install numpy pandas scikit-learn
      - name: Download prior OOF archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads/amazon downloads/external downloads/bge
          gh run download 42236520330 -n amazon-roberta-sentiment-transfer-cv -D downloads/amazon
          gh run download 42238448742 -n external-sst5-decontaminated-train-cv -D downloads/external
          gh run download 42237818915 -n strong-sentiment-cached-feature-cv -D downloads/bge
          find downloads -name 'oof_predictions.csv' -print
      - name: Evaluate fixed vote
        run: |
          python experiments/target_050_vote.py \
            --amazon downloads/amazon --external downloads/external --cached downloads/bge \
            --out experiments/results/target_050_vote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-050-majority-vote-evaluation
          path: experiments/results/target_050_vote/
          if-no-files-found: warn
