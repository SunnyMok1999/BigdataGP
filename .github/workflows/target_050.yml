name: Find 0.50 macro F1 on train-only five-class sentiment
on:
  push:
    branches: [experiment/target-050-macro-f1]
    paths:
      - "experiments/target_050.py"
      - ".github/workflows/target_050.yml"
  workflow_dispatch:
jobs:
  nested-model-search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [bge_classifiers, fused_embeddings, lexical]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pandas scipy scikit-learn
      - name: Run nested training-only evaluation
        shell: bash
        run: |
          if [[ "${{ matrix.group }}" == "bge_classifiers" ]]; then
            python experiments/target_050.py --models bge_rbf bge_linear bge_ordinal --out experiments/results/target_050_bge
          elif [[ "${{ matrix.group }}" == "fused_embeddings" ]]; then
            python experiments/target_050.py --models bge_minilm_rbf bge_bert_rbf bge_all_linear bge_all_rbf --out experiments/results/target_050_fusion
          else
            python experiments/target_050.py --models wordchar_svm wordchar_bge --out experiments/results/target_050_lexical
          fi
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-050-${{ matrix.group }}
          path: experiments/results/target_050_*/
          if-no-files-found: warn
