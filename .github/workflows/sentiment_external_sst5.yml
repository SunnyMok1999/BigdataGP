name: Decontaminated SST5 external-data sentiment experiment
on:
  push:
    branches: [experiment/target-macro-f1-050]
    paths:
      - ".github/workflows/sentiment_external_sst5.yml"
  workflow_dispatch:
jobs:
  external_data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dataset and model dependencies
        run: |
          python -m pip install numpy pandas scipy scikit-learn rapidfuzz datasets==3.6.0 transformers==4.48.3 safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Exclude near-duplicates of local training and held-out TEST TEXT only
        env:
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python experiments/external_sst5_decontaminated.py \
            --train train.csv --test-text test.csv \
            --near-duplicate-threshold 90 \
            --output experiments/results/external_sst5_decontaminated
      - name: Save audit, local predictions and external embeddings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-sst5-decontaminated-train-cv
          path: experiments/results/external_sst5_decontaminated/
          if-no-files-found: warn
